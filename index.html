<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141d"><meta name="description" content="A private, minimalist PDF reader."><title>PDF Inspector Gadget</title><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.webmanifest"></head>
<body><div class="app"><header><div class="brand"><span class="logo">▤</span><div><strong>PDF Inspector Gadget</strong><small>Simple. Private. Focused.</small></div></div><button id="openTop" class="quiet" type="button">Open PDF</button></header>
<main><section id="welcome" class="welcome"><div class="mark">▤</div><h1>Your PDFs, simply.</h1><p>Open a PDF from your device and read it here. Your document stays on your device.</p><button id="choose" class="primary" type="button">Choose PDF</button><p class="hint">No uploads · No accounts · No clutter</p></section>
<section id="reader" class="reader hidden" aria-label="PDF reader"><div class="toolbar"><div class="filename" id="filename">Document</div><div class="tools"><button id="searchToggle" title="Search text" aria-label="Search text">⌕</button><button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button><span id="zoomLabel">100%</span><button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button><button id="fit" title="Fit width">Fit</button></div></div><div id="searchBar" class="searchbar hidden"><input id="searchInput" type="search" placeholder="Find text in PDF" aria-label="Search PDF text"><button id="searchNext">Find</button><span id="searchStatus" role="status"></span></div><div id="pages" class="pages" aria-label="Document pages"></div><div class="status"><span id="pageStatus">Page 1 of 1</span><button id="another" type="button">Open another PDF</button></div></section></main><input id="file" type="file" accept="application/pdf,.pdf" hidden><footer>Built for reading, not managing.</footer></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module" id="pdfLib"></script><script type="module" src="./app.js"></script></body></html>
